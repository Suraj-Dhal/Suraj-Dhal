<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="Experience: Digital Marketing Executive, Aveti Learning Pvt. Ltd. · Bhubaneswar, Jun 2025 – Sep 2025; Digital Marketing Intern, ScaleOXperts · Remote / Hybrid, Jun 2025 – Oct 2025; Sales and Marketing Intern, Aveti Learning Pvt. Ltd. · Bhubaneswar, Mar 2024 – Aug 2024">
  <defs>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#101012"/>
      <path d="M20 0 40 20 20 40 0 20Z" fill="#17171a"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="510" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glow" cx="1120" cy="40" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e2219" stop-opacity="0.95"/>
