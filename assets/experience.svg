  </g>
  <text class="rise" style="animation-delay:0.1s" x="64" y="112" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1"><tspan>Roles</tspan><tspan> and</tspan><tspan fill="#fe5206" font-style="italic"> results</tspan></text>
