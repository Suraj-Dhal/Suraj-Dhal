    <text fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18"><tspan x="112" y="406">15+ SEO audits, 1,000+ backlinks and content plans for 10+ clients.</tspan><tspan x="112" y="432">Named Best Intern of the Month.</tspan></text>
