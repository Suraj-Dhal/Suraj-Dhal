<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Recognition: Best Intern of the Month at ScaleOXperts, August 2025; Letter of Recommendation from the ScaleOXperts co-founder, November 2025.">
  <defs>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#101012"/>
      <path d="M20 0 40 20 20 40 0 20Z" fill="#17171a"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="150" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glow" cx="600" cy="150" r="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e2219" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3e2219" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="150" rx="16"/></clipPath>
  </defs>
  <style>
    .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1s ease both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.16,1,.3,1) both; }
    .growy { transform-box: fill-box; transform-origin: center top; animation: growy 1s cubic-bezier(.16,1,.3,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 4.2s ease-in-out infinite; }
    .run { animation: run 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="150" fill="#0b0b0d"/>
    
    <rect width="1200" height="150" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="149" rx="15.5" fill="none" stroke="#2a2a2e"/>
  <g class="rise" style="animation-delay:0.1s">
    <rect x="40" y="32" width="550" height="86" rx="12" fill="#141418" stroke="#2a2a2e"/>
    <g class="pop pulse" style="animation-delay:0.3s"><path d="M84 59l3.8 8.4 9.2 1-6.9 6.2 2 9-8.1-4.7-8.1 4.7 2-9-6.9-6.2 9.2-1z" fill="#fe5206"/></g>
    <text x="120" y="68" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700">Best Intern of the Month</text>
    <text x="120" y="96" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16">ScaleOXperts · Certificate of Appreciation, August 2025</text>
  </g>
  <g class="rise" style="animation-delay:0.25s">
    <rect x="610" y="32" width="550" height="86" rx="12" fill="#141418" stroke="#2a2a2e"/>
    <g class="pop pulse" style="animation-delay:0.44999999999999996s"><path d="M654 59l3.8 8.4 9.2 1-6.9 6.2 2 9-8.1-4.7-8.1 4.7 2-9-6.9-6.2 9.2-1z" fill="#fe5206"/></g>
    <text x="690" y="68" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700">Letter of Recommendation</text>
    <text x="690" y="96" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16">ScaleOXperts co-founder · November 2025</text>
  </g>
</svg>
