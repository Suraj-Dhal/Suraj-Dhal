<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Education: Bachelor of Business Administration, Utkal University, 2025 to 2028. Digital Marketing and Analytics, Digital Academy 360, 2025. Certifications: Digital Marketing and Analytics, Google Ads, SEO, Social Media Marketing, Generative AI for Business.">
  <defs>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
      <rect width="40" height="40" fill="#0f0f11"/>
      <path d="M20 0 40 20 20 40 0 20Z" fill="#151518"/>
    </pattern>
    <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="0" x2="1200" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="440" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3e2219" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3e2219" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1s ease both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.16,1,.3,1) both; }
    .growy { transform-box: fill-box; transform-origin: center top; animation: growy 1s cubic-bezier(.16,1,.3,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 4.2s ease-in-out infinite; }
    .run { animation: run 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1200" height="440" fill="#0b0b0d"/>
  <rect width="1200" height="440" fill="url(#diamonds)" mask="url(#fadeMask)"/>
  
  
  <g class="fade">
    <rect class="growy" x="64" y="46" width="3" height="20" fill="#fe5206"/>
    <text x="78" y="62" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.6">EDUCATION</text>
  </g>
  <text class="rise" style="animation-delay:0.1s" x="64" y="112" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1"><tspan>Learning</tspan><tspan> and</tspan><tspan fill="#fe5206" font-style="italic"> credentials</tspan></text>
  <text class="fade" x="64" y="164" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">EDUCATION</text>
  <g class="rise" style="animation-delay:0.2s">
    <text x="64" y="206" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700">Bachelor of Business Administration</text>
    <text x="64" y="234" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17"><tspan fill="#fe5206" font-style="italic" font-weight="600">Utkal University</tspan>  ·  2025 – 2028</text>
  </g>
  <g class="rise" style="animation-delay:0.32s">
    <text x="64" y="278" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700">Digital Marketing and Analytics</text>
    <text x="64" y="306" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17"><tspan fill="#fe5206" font-style="italic" font-weight="600">Digital Academy 360</tspan>  ·  2025</text>
  </g>
  <text class="fade" style="animation-delay:0.1s" x="640" y="164" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">CERTIFICATIONS</text>
  <g class="rise" style="animation-delay:0.3s">
    <rect x="640" y="186" width="362" height="38" rx="6" fill="#131316" stroke="#232328"/>
    <circle cx="657" cy="205" r="3.6" fill="#fe5206"/>
    <text x="670" y="211" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500">Digital Marketing and Analytics</text>
  </g>
