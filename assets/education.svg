  </g>
  <g class="rise" style="animation-delay:0.4s">
    <rect x="798" y="236" width="77" height="38" rx="6" fill="#131316" stroke="#232328"/>
    <circle cx="815" cy="255" r="3.6" fill="#fe5206"/>
    <text x="828" y="261" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500">SEO</text>
  </g>
  <g class="rise" style="animation-delay:0.45s">
    <rect x="640" y="286" width="270" height="38" rx="6" fill="#131316" stroke="#232328"/>
    <circle cx="657" cy="305" r="3.6" fill="#fe5206"/>
    <text x="670" y="311" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500">Social Media Marketing</text>
  </g>
  <g class="rise" style="animation-delay:0.5s">
    <rect x="640" y="336" width="311" height="38" rx="6" fill="#131316" stroke="#232328"/>
    <circle cx="657" cy="355" r="3.6" fill="#fe5206"/>
    <text x="670" y="361" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500">Generative AI for Business</text>
