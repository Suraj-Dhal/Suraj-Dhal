<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="sharanikadhal.co.in: Dr. Sharanika Dhal · Sri Sri University. Research, publications, books and conference work for an HR professor. Built with React, TypeScript, Vite, Tailwind CSS.">
  <defs>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)">
      <rect width="40" height="40" fill="#0f0f11"/>
      <path d="M20 0 40 20 20 40 0 20Z" fill="#151518"/>
    </pattern>
    <linearGradient id="fadeGrad" gradientUnits="userSpaceOnUse" x1="0" x2="1200" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="600" height="320" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3e2219" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3e2219" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1s ease both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.16,1,.3,1) both; }
    .growy { transform-box: fill-box; transform-origin: center top; animation: growy 1s cubic-bezier(.16,1,.3,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 4.2s ease-in-out infinite; }
    .run { animation: run 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="600" height="320" fill="#0b0b0d"/>
  <rect width="600" height="320" fill="url(#diamonds)" mask="url(#fadeMask)"/>
  <ellipse cx="550" cy="220" rx="260" ry="120" fill="url(#glow)"/>
  <rect x="64" y="8" width="526" height="272" rx="14" fill="#131316" fill-opacity=".85" stroke="#232328"/>
  <rect class="run" x="64" y="8" width="526" height="272" rx="14" fill="none" stroke="#fe5206" stroke-width="2" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round"/>
  <g class="fade">
    <rect class="growy" x="96" y="38" width="3" height="18" fill="#fe5206"/>
    <text x="109" y="53" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">ACADEMIC PORTFOLIO</text>
  </g>
  <text class="rise" style="animation-delay:0.12s" x="96" y="104" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-1">sharanikadhal.co.in<tspan fill="#fe5206" font-weight="700" dx="8">↗</tspan></text>
  <text class="rise" style="animation-delay:0.22s" x="96" y="136" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" font-style="italic">Dr. Sharanika Dhal · Sri Sri University</text>
  <text class="rise" style="animation-delay:0.32s" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17"><tspan x="96" y="172">Research, publications, books and</tspan><tspan x="96" y="197">conference work for an HR professor.</tspan></text>

  <g class="rise" style="animation-delay:0.45s">
    <rect x="96" y="224" width="70" height="33" rx="5" fill="#ececec"/>
    <circle cx="131" cy="224" r="3.4" fill="#fe5206"/>
    <text x="131" y="245" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500">React</text>
  </g>
  <g class="rise" style="animation-delay:0.53s">
    <rect x="178" y="224" width="107" height="33" rx="5" fill="#ececec"/>
    <circle cx="231.5" cy="224" r="3.4" fill="#fe5206"/>
    <text x="231.5" y="245" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500">TypeScript</text>
  </g>
  <g class="rise" style="animation-delay:0.61s">
    <rect x="297" y="224" width="62" height="33" rx="5" fill="#ececec"/>
    <circle cx="328" cy="224" r="3.4" fill="#fe5206"/>
    <text x="328" y="245" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500">Vite</text>
  </g>
  <g class="rise" style="animation-delay:0.69s">
    <rect x="371" y="224" width="122" height="33" rx="5" fill="#ececec"/>
    <circle cx="432" cy="224" r="3.4" fill="#fe5206"/>
    <text x="432" y="245" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500">Tailwind CSS</text>
  </g>
</svg>
