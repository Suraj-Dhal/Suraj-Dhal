<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="sunilkumardhal.in: 28 years of research, publications, awards and teaching, bridging computation and commerce.">
  <defs>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#101012"/>
      <path d="M20 0 40 20 20 40 0 20Z" fill="#17171a"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="600" height="300" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glow" cx="540" cy="270" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e2219" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3e2219" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1s ease both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.16,1,.3,1) both; }
    .growy { transform-box: fill-box; transform-origin: center top; animation: growy 1s cubic-bezier(.16,1,.3,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 4.2s ease-in-out infinite; }
    .run { animation: run 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="#0b0b0d"/>
    <rect width="600" height="300" fill="url(#diamonds)" mask="url(#fadeMask)"/>
    <rect width="600" height="300" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="299" rx="15.5" fill="none" stroke="#2a2a2e"/>
  <rect class="run" x="1" y="1" width="598" height="298" rx="15" fill="none" stroke="#fe5206" stroke-width="2" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round"/>
  
  <g class="fade" style="animation-delay:0s">
    <rect class="growy" x="40" y="38" width="3" height="20" fill="#fe5206"/>
    <text x="54" y="54" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.4">ACADEMIC PORTFOLIO</text>
  </g>
  <text class="rise" style="animation-delay:0.12s" x="40" y="110" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="-1">sunilkumardhal.in<tspan fill="#fe5206" font-weight="700" dx="8">↗</tspan></text>
  <text class="rise" style="animation-delay:0.22s" x="40" y="144" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" font-style="italic">Dr. Sunil Kumar Dhal · Sri Sri University</text>
  <text class="rise" style="animation-delay:0.32s" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18"><tspan x="40" y="184">28 years of research, publications, awards</tspan><tspan x="40" y="210">and teaching, bridging computation and commerce.</tspan></text>

  <g class="rise" style="animation-delay:0.45s">
    <rect x="40" y="238" width="70" height="32" rx="5" fill="#ececec"/>
    <circle cx="75" cy="238" r="3.2" fill="#fe5206"/>
    <text x="75" y="259" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500">React</text>
  </g>
  <g class="rise" style="animation-delay:0.53s">
    <rect x="120" y="238" width="62" height="32" rx="5" fill="#ececec"/>
    <circle cx="151" cy="238" r="3.2" fill="#fe5206"/>
    <text x="151" y="259" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500">Vite</text>
  </g>
  <g class="rise" style="animation-delay:0.61s">
    <rect x="192" y="238" width="126" height="32" rx="5" fill="#ececec"/>
    <circle cx="255" cy="238" r="3.2" fill="#fe5206"/>
    <text x="255" y="259" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500">Tailwind CSS</text>
  </g>
</svg>
