<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Impact: 10+ businesses supported, 15+ SEO and digital audits, 450+ verified school leads, 1,000+ backlinks built.">
  <defs>
    <pattern id="diamonds" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#101012"/>
      <path d="M20 0 40 20 20 40 0 20Z" fill="#17171a"/>
    </pattern>
    <linearGradient id="fadeGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.6" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="230" fill="url(#fadeGrad)"/></mask>
    <radialGradient id="glow" cx="1100" cy="230" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e2219" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3e2219" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="230" rx="16"/></clipPath>
  </defs>
  <style>
    .rise { animation: rise .8s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1s ease both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.16,1,.3,1) both; }
    .growy { transform-box: fill-box; transform-origin: center top; animation: growy 1s cubic-bezier(.16,1,.3,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .twinkle { animation: twinkle 4.2s ease-in-out infinite; }
    .run { animation: run 6s linear infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .6; } }
    @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="230" fill="#0b0b0d"/>
    
    <rect width="1200" height="230" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="15.5" fill="none" stroke="#2a2a2e"/>
  <g class="rise" style="animation-delay:0.1s">
    <rect x="32" y="32" width="269" height="166" rx="12" fill="#141418" stroke="#2a2a2e"/>
    <text x="56" y="102" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">10+</text>
    <rect class="grow" style="animation-delay:0.5s" x="56" y="120" width="44" height="3" fill="#fe5206"/>
    <text x="56" y="154" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">businesses supported</text>
    <text x="56" y="180" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16">across education and tech</text>
  </g>
  <g class="rise" style="animation-delay:0.22s">
    <rect x="321" y="32" width="269" height="166" rx="12" fill="#141418" stroke="#2a2a2e"/>
    <text x="345" y="102" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">15+</text>
    <rect class="grow" style="animation-delay:0.62s" x="345" y="120" width="44" height="3" fill="#fe5206"/>
    <text x="345" y="154" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">SEO and digital audits</text>
    <text x="345" y="180" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16">turned into growth roadmaps</text>
  </g>
  <g class="rise" style="animation-delay:0.33999999999999997s">
    <rect x="610" y="32" width="269" height="166" rx="12" fill="#141418" stroke="#2a2a2e"/>
    <text x="634" y="102" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">450+</text>
    <rect class="grow" style="animation-delay:0.74s" x="634" y="120" width="44" height="3" fill="#fe5206"/>
    <text x="634" y="154" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">verified school leads</text>
    <text x="634" y="180" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16">for regional expansion</text>
  </g>
  <g class="rise" style="animation-delay:0.45999999999999996s">
    <rect x="899" y="32" width="269" height="166" rx="12" fill="#141418" stroke="#2a2a2e"/>
    <text x="923" y="102" fill="#fe5206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">1,000+</text>
    <rect class="grow" style="animation-delay:0.86s" x="923" y="120" width="44" height="3" fill="#fe5206"/>
    <text x="923" y="154" fill="#f4f4f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">backlinks built</text>
    <text x="923" y="180" fill="#a8a8ac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16">for client search visibility</text>
  </g>
</svg>
